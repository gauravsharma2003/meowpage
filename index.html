<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Tap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float-away {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--float-x), var(--float-y)) scale(1.5);
                opacity: 0;
            }
        }

        .meow-text {
            animation: float-away 1.5s ease-out forwards;
            pointer-events: none;
        }

        body {
            background-color: #fce7f3;
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen overflow-hidden relative">
    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 z-0">
        <img 
            src="https://media.makeameme.org/created/meow-meow-0d5266ae29.jpg" 
            alt="Meow Cat" 
            class="w-full h-full object-cover"
        />
        <div class="absolute inset-0 bg-zinc-600 opacity-20"></div>
    </div>

    <!-- Container for floating meow texts -->
    <div id="meowContainer" class="absolute inset-0 pointer-events-none z-20"></div>

    <script>
        const meowContainer = document.getElementById('meowContainer');
        const body = document.body;

        body.addEventListener('click', function(e) {
            // Play sound (you can add your own sound file)
            const audio = new Audio('meow.mp3');
            audio.play();

            // Generate random number of meow texts (5-10)
            const numMeows = Math.floor(Math.random() * 6) + 5;

            for (let i = 0; i < numMeows; i++) {
                setTimeout(() => {
                    createMeowText(e.clientX, e.clientY);
                }, i * 50);
            }
        });

        function createMeowText(startX, startY) {
            const meowText = document.createElement('div');
            meowText.textContent = 'meow';
            meowText.className = 'meow-text absolute text-pink-900 font-bold text-xl';
            
            // Random angle and distance
            const angle = Math.random() * Math.PI * 2;
            const distance = 150 + Math.random() * 150;
            const floatX = Math.cos(angle) * distance;
            const floatY = Math.sin(angle) * distance;
            
            meowText.style.left = startX + 'px';
            meowText.style.top = startY + 'px';
            meowText.style.setProperty('--float-x', floatX + 'px');
            meowText.style.setProperty('--float-y', floatY + 'px');
            
            meowContainer.appendChild(meowText);
            
            // Remove after animation
            setTimeout(() => {
                meowText.remove();
            }, 1500);
        }
    </script>
</body>
</html>
