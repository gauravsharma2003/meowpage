<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Button</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float-away {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--float-x), var(--float-y)) scale(1.5);
                opacity: 0;
            }
        }

        @keyframes tap-pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.95);
            }
        }

        .meow-text {
            animation: float-away 1.5s ease-out forwards;
            pointer-events: none;
        }

        .tap-animate {
            animation: tap-pulse 0.3s ease-in-out;
        }

        body {
            background-color: #fce7f3;
        }
    </style>
</head>
<body class="min-h-screen overflow-hidden relative">
    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 z-0">
        <img 
            src="https://media.makeameme.org/created/meow-meow-0d5266ae29.jpg" 
            alt="Meow Cat" 
            class="w-full h-full object-cover"
        />
        <div class="absolute inset-0 bg-zinc-600 opacity-20"></div>
    </div>

    <!-- Content Container -->
    <div class="absolute bottom-0 left-0 right-0 z-10 flex flex-col items-center pb-12">
        <!-- Meow Button -->
        <button 
            id="meowBtn"
            class="bg-pink-300 hover:bg-pink-400 text-pink-900 font-bold text-2xl px-12 py-6 rounded-full shadow-2xl transition-all duration-200 hover:shadow-pink-500/50 active:scale-95"
        >
            Meow
        </button>
    </div>

    <!-- Container for floating meow texts -->
    <div id="meowContainer" class="absolute inset-0 pointer-events-none z-20"></div>

    <script>
        const meowBtn = document.getElementById('meowBtn');
        const meowContainer = document.getElementById('meowContainer');

        meowBtn.addEventListener('click', function() {
            // Add tap animation
            meowBtn.classList.add('tap-animate');
            setTimeout(() => {
                meowBtn.classList.remove('tap-animate');
            }, 300);

            // Play sound (you can add your own sound file)
            const audio = new Audio('meow.mp3');
            audio.play();

            // Generate random number of meow texts (5-10)
            const numMeows = Math.floor(Math.random() * 6) + 5;

            // Get button position
            const btnRect = meowBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            for (let i = 0; i < numMeows; i++) {
                setTimeout(() => {
                    createMeowText(btnCenterX, btnCenterY);
                }, i * 50);
            }
        });

        function createMeowText(startX, startY) {
            const meowText = document.createElement('div');
            meowText.textContent = 'meow';
            meowText.className = 'meow-text absolute text-pink-900 font-bold text-xl';
            
            // Random angle and distance
            const angle = Math.random() * Math.PI * 2;
            const distance = 150 + Math.random() * 150;
            const floatX = Math.cos(angle) * distance;
            const floatY = Math.sin(angle) * distance;
            
            meowText.style.left = startX + 'px';
            meowText.style.top = startY + 'px';
            meowText.style.setProperty('--float-x', floatX + 'px');
            meowText.style.setProperty('--float-y', floatY + 'px');
            
            meowContainer.appendChild(meowText);
            
            // Remove after animation
            setTimeout(() => {
                meowText.remove();
            }, 1500);
        }
    </script>
</body>
</html>
